name: Build Native Android APK (စာ)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'sar-app.apk'
      - '.github/keystore/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Generate Native Android WebView Project
        run: |
          mkdir -p android-native/app/src/main/java/com/sar/library
          mkdir -p android-native/app/src/main/res/drawable
          mkdir -p android-native/app/src/main/res/values
          mkdir -p .github/keystore

          # Copy icon.png from repo root into Android drawable
          if [ -f "icon.png" ]; then
            cp icon.png android-native/app/src/main/res/drawable/ic_launcher.png
          else
            convert -size 512x512 xc:#6B141A android-native/app/src/main/res/drawable/ic_launcher.png || true
          fi

          # Create persistent keystore so future APK updates install smoothly
          if [ ! -f ".github/keystore/release.jks" ]; then
            keytool -genkeypair -v \
              -keystore .github/keystore/release.jks \
              -alias sar_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass sar123456 \
              -keypass sar123456 \
              -dname "CN=Sar Library, OU=Digital, O=Sar, L=Mandalay, S=MDY, C=MM"
          fi

          cat << 'EOF' > android-native/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SarLibrary"
          include ':app'
          EOF

          cat << 'EOF' > android-native/build.gradle
          plugins {
              id 'com.android.application' version '8.3.0' apply false
          }
          EOF

          cat << 'EOF' > android-native/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sar.library'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sar.library"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              signingConfigs {
                  release {
                      storeFile file("${rootDir}/../.github/keystore/release.jks")
                      storePassword "sar123456"
                      keyAlias "sar_key"
                      keyPassword "sar123456"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android-native/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:statusBarColor">#1E120A</item>
                  <item name="android:navigationBarColor">#1E120A</item>
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-native/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.sar.library">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="စာ"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:enableOnBackInvokedCallback="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-native/app/src/main/java/com/sar/library/MainActivity.java
          package com.sar.library;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String APP_URL = "https://waiyanoocreative-ops.github.io/myBooks/index.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#FAF8F5"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setSupportZoom(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void exitApp() {
                          runOnUiThread(() -> {
                              finishAndRemoveTask();
                              System.exit(0);
                          });
                      }
                  }, "AndroidNative");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              if (url.contains("waiyanoocreative-ops.github.io") || url.contains("supabase.co")) {
                                  return false;
                              }
                          }
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // Connect confirmExitApp() button in index.html directly to Native Exit
                          view.evaluateJavascript(
                              "window.confirmExitApp = function() { if(window.AndroidNative) { window.AndroidNative.exitApp(); } else { window.close(); } };",
                              null
                          );
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onCloseWindow(WebView window) {
                          finishAndRemoveTask();
                          System.exit(0);
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView == null) {
                      super.onBackPressed();
                      return;
                  }
                  String jsCheck = "(function() {" +
                      "var modals = ['exitConfirmModal','settingsModal','themeSelectorModal','notificationsModal','requestBookModal','pdfReaderModal','bookDetailModal'];" +
                      "for (var i = 0; i < modals.length; i++) {" +
                      "  var el = document.getElementById(modals[i]);" +
                      "  if (el && el.style.display !== 'none' && el.style.display !== '') {" +
                      "    el.style.display = 'none';" +
                      "    if (modals[i] === 'pdfReaderModal' && typeof loadBooks === 'function') loadBooks();" +
                      "    return 'CLOSED_MODAL';" +
                      "  }" +
                      "}" +
                      "if (typeof activeBottomFilter !== 'undefined' && activeBottomFilter !== 'all' && typeof setBottomNavFilter === 'function') {" +
                      "  setBottomNavFilter('all');" +
                      "  return 'RESET_FILTER';" +
                      "}" +
                      "var exitEl = document.getElementById('exitConfirmModal');" +
                      "if (exitEl) { exitEl.style.display = 'flex'; return 'SHOWED_EXIT'; }" +
                      "return 'EXIT_NOW';" +
                      "})()";

                  webView.evaluateJavascript(jsCheck, result -> {
                      if (result != null && result.contains("EXIT_NOW")) {
                          finishAndRemoveTask();
                      }
                  });
              }
          }
          EOF

      - name: 6. Build Signed Release APK
        working-directory: android-native
        run: gradle assembleRelease

      - name: 7. Copy APK to Repository Root (sar-app.apk)
        run: |
          cp android-native/app/build/outputs/apk/release/app-release.apk ./sar-app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sar-app.apk .github/keystore/release.jks
          git diff --staged --quiet || git commit -m "chore: build pure native WebView sar-app.apk [skip ci]"
          git push

      - name: 8. Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: စာ-Pure-Native-APK
          path: sar-app.apk
