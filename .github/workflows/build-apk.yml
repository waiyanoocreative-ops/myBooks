name: Build Android APK, PlayStore AAB & iOS App Profile

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sar-app.apk'
      - 'sar-app.aab'
      - 'sar-ios.mobileconfig'
      - 'privacy.html'
      - 'books/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all-platforms:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Generate iOS Profile & Privacy Policy
        run: |
          python3 -c '
          import base64, os
          icon_b64 = ""
          if os.path.exists("icon.png"):
              icon_b64 = base64.b64encode(open("icon.png", "rb").read()).decode()
          mc = f"""<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
            <key>PayloadContent</key>
            <array>
              <dict>
                <key>FullScreen</key><true/>
                <key>IgnoreManifestScope</key><true/>
                <key>IsRemovable</key><true/>
                <key>Label</key><string>စာ</string>
                <key>PayloadDescription</key><string>စာ — ဒစ်ဂျစ်တယ် စာကြည့်တိုက် iOS App</string>
                <key>PayloadDisplayName</key><string>စာ (Digital Library)</string>
                <key>PayloadIdentifier</key><string>com.waiyanoo.sar.webclip</string>
                <key>PayloadType</key><string>com.apple.webClip.managed</string>
                <key>PayloadUUID</key><string>A1B2C3D4-E5F6-4789-8012-3456789ABCDE</string>
                <key>PayloadVersion</key><integer>1</integer>
                <key>Precomposed</key><true/>
                <key>URL</key><string>https://waiyanoocreative-ops.github.io/myBooks/</string>
                <key>Icon</key><data>{icon_b64}</data>
              </dict>
            </array>
            <key>PayloadDescription</key><string>စာ ဒစ်ဂျစ်တယ် စာကြည့်တိုက် iOS App Profile</string>
            <key>PayloadDisplayName</key><string>စာ — iOS App Installer</string>
            <key>PayloadIdentifier</key><string>com.waiyanoo.sar.profile</string>
            <key>PayloadOrganization</key><string>စာ Digital Library</string>
            <key>PayloadRemovalDisallowed</key><false/>
            <key>PayloadType</key><string>Configuration</string>
            <key>PayloadUUID</key><string>F9E8D7C6-B5A4-4321-9876-543210FEDCBA</string>
            <key>PayloadVersion</key><integer>1</integer>
          </dict>
          </plist>"""
          open("sar-ios.mobileconfig", "w", encoding="utf-8").write(mc.strip())

          priv = """<!DOCTYPE html>
          <html lang="my">
          <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Privacy Policy — စာ</title>
          <style>body{font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.7;background:#faf8f5;color:#1f2937}h1,h2{color:#6B141A}.card{background:#fff;padding:24px;border-radius:16px}</style>
          </head>
          <body><div class="card">
          <h1>Privacy Policy (ကိုယ်ရေးအချက်အလက် မူဝါဒ)</h1>
          <p><strong>စာ ဒစ်ဂျစ်တယ် စာကြည့်တိုက်</strong> သည် စာဖတ်သူများ၏ ပုဂ္ဂိုလ်ရေးဆိုင်ရာ အချက်အလက်များကို လုံးဝ ရယူသိမ်းဆည်းခြင်း မရှိပါ။</p>
          <h2>သိမ်းဆည်းသော အချက်အလက်များ</h2>
          <p>စာဖတ်သူ နောက်ဆုံးဖတ်ရှုခဲ့သော စာမျက်နှာနံပါတ်နှင့် App Settings များကို သုံးစွဲသူ၏ ဖုန်းအတွင်း၌သာ သိမ်းဆည်းပါသည်။</p>
          </div></body>
          </html>"""
          open("privacy.html", "w", encoding="utf-8").write(priv.strip())
          '

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Build Android APK & AAB
        run: |
          mkdir -p android-app/app/src/main/java/com/waiyanoo/sar
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

          if [ -f "icon.png" ]; then
            cp icon.png android-app/app/src/main/res/drawable/ic_launcher.png
            cp icon.png android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon.png android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "SarLibrary"
          include ':app'
          EOF

          cat << 'EOF' > android-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.waiyanoo.sar'
              compileSdk 34

              defaultConfig {
                  applicationId "com.waiyanoo.sar"
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "sarlibrarypass"
                      keyAlias "sarkey"
                      keyPassword "sarlibrarypass"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.waiyanoo.sar">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="စာ"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/waiyanoo/sar/MainActivity.java
          package com.waiyanoo.sar;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String APP_URL = "https://waiyanoocreative-ops.github.io/myBooks/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.parseColor("#6B141A"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://waiyanoocreative-ops.github.io")) {
                              return false;
                          }
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String html = "<html><body style=\"background:#FAF8F5;color:#1E1916;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:24px;\"><h2>အင်တာနက် ချိတ်ဆက်မှု မရှိပါ</h2><button onclick=\"location.href='" + APP_URL + "'\" style=\"background:#6B141A;color:#fff;border:none;padding:12px 24px;border-radius:999px;font-weight:bold;\">ပြန်လည်ချိတ်ဆက်မည်</button></body></html>";
                              view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          keytool -genkey -v -keystore android-app/app/release.keystore \
            -alias sarkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sarlibrarypass -keypass sarlibrarypass \
            -dname "CN=WaiYanOo, OU=SarLibrary, O=Sar, L=Mandalay, S=Mandalay, C=MM"

          cd android-app
          gradle assembleRelease bundleRelease
          cd ..
          cp android-app/app/build/outputs/apk/release/app-release.apk ./sar-app.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab ./sar-app.aab

      - name: 5. Commit & Push Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sar-app.apk sar-app.aab sar-ios.mobileconfig privacy.html
          git diff --staged --quiet || git commit -m "Auto-build Android APK, PlayStore AAB & iOS App Profile"
          git push
