name: Build Native Android APK (စာ)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'sar-app.apk'
      - '.github/keystore/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Generate Native Android WebView Project
        run: |
          python3 - << 'EOF'
          import os, shutil, subprocess

          base = "android-native/app/src/main"
          os.makedirs(f"{base}/java/com/sar/library", exist_ok=True)
          os.makedirs(f"{base}/res/drawable", exist_ok=True)
          os.makedirs(f"{base}/res/values", exist_ok=True)
          os.makedirs(".github/keystore", exist_ok=True)

          if os.path.exists("icon.png"):
              shutil.copy("icon.png", f"{base}/res/drawable/ic_launcher.png")

          if not os.path.exists(".github/keystore/release.jks"):
              subprocess.run([
                  "keytool", "-genkeypair", "-v",
                  "-keystore", ".github/keystore/release.jks",
                  "-alias", "sar_key", "-keyalg", "RSA", "-keysize", "2048",
                  "-validity", "10000", "-storepass", "sar123456", "-keypass", "sar123456",
                  "-dname", "CN=Sar Library, OU=Digital, O=Sar, L=Mandalay, S=MDY, C=MM"
              ], check=True)

          with open("android-native/settings.gradle", "w") as f:
              f.write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SarLibrary"
          include ':app'
          ''')

          with open("android-native/build.gradle", "w") as f:
              f.write('''plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ''')

          with open("android-native/app/build.gradle", "w") as f:
              f.write('''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sar.library'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sar.library"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              aaptOptions {
                  cruncherEnabled = false
              }

              signingConfigs {
                  release {
                      storeFile file("${rootDir}/../.github/keystore/release.jks")
                      storePassword "sar123456"
                      keyAlias "sar_key"
                      keyPassword "sar123456"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ''')

          with open(f"{base}/res/values/styles.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:statusBarColor">#1E120A</item>
                  <item name="android:navigationBarColor">#1E120A</item>
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          ''')

          with open(f"{base}/AndroidManifest.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="စာ"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          with open(f"{base}/java/com/sar/library/MainActivity.java", "w") as f:
              f.write('''package com.sar.library;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String APP_URL = "https://waiyanoocreative-ops.github.io/myBooks/index.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#FAF8F5"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setSupportZoom(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void exitApp() {
                          runOnUiThread(() -> {
                              finishAndRemoveTask();
                              System.exit(0);
                          });
                      }
                  }, "AndroidNative");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              if (url.contains("waiyanoocreative-ops.github.io") || url.contains("supabase.co") || url.contains("githubusercontent.com")) {
                                  return false;
                              }
                          }
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(
                              "window.confirmExitApp = function() { if(window.AndroidNative) { window.AndroidNative.exitApp(); } else { window.close(); } };",
                              null
                          );
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView == null) {
                      super.onBackPressed();
                      return;
                  }
                  String jsCheck = "(function() {" +
                      "var modals = ['exitConfirmModal','settingsModal','themeSelectorModal','notificationsModal','requestBookModal','pdfReaderModal','bookDetailModal'];" +
                      "for (var i = 0; i < modals.length; i++) {" +
                      "  var el = document.getElementById(modals[i]);" +
                      "  if (el && el.style.display !== 'none' && el.style.display !== '') {" +
                      "    el.style.display = 'none';" +
                      "    if (modals[i] === 'pdfReaderModal' && typeof loadBooks === 'function') loadBooks();" +
                      "    return 'CLOSED_MODAL';" +
                      "  }" +
                      "}" +
                      "if (typeof activeBottomFilter !== 'undefined' && activeBottomFilter !== 'all' && typeof setBottomNavFilter === 'function') {" +
                      "  setBottomNavFilter('all');" +
                      "  return 'RESET_FILTER';" +
                      "}" +
                      "var exitEl = document.getElementById('exitConfirmModal');" +
                      "if (exitEl) { exitEl.style.display = 'flex'; return 'SHOWED_EXIT'; }" +
                      "return 'EXIT_NOW';" +
                      "})()";

                  webView.evaluateJavascript(jsCheck, result -> {
                      if (result != null && result.contains("EXIT_NOW")) {
                          finishAndRemoveTask();
                      }
                  });
              }
          }
          ''')
          EOF

      - name: 5. Build Signed Release APK
        working-directory: android-native
        run: gradle assembleRelease --no-daemon

      - name: 6. Publish sar-app.apk to Repository
        run: |
          cp android-native/app/build/outputs/apk/release/app-release.apk ./sar-app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf .github/workflows/.github || true
          git add sar-app.apk .github/keystore/release.jks
          git diff --staged --quiet || git commit -m "chore: publish native sar-app.apk"
          git push

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: စာ-Pure-Native-APK
          path: sar-app.apk
