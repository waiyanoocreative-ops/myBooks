<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>စာ — ဒစ်ဂျစ်တယ် စာကြည့်တိုက်</title>
  <meta name="theme-color" content="#0D0F14" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Playfair+Display:wght@700&display=swap');

    :root {
      --bg-main: #0D0F14;
      --bg-shelf-box: #12151E;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
    }
    body.theme-paper {
      --bg-main: #FAF8F5;
      --bg-shelf-box: #F3EFE6;
      --text-main: #1E1916;
      --text-muted: #786E65;
    }
    body {
      font-family: 'Padauk', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.65;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .font-serif-display { font-family: 'Playfair Display', 'Padauk', serif; }
    .tactile-btn { transition: transform 0.12s ease, opacity 0.15s ease; }
    .tactile-btn:active { transform: scale(0.95); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 3D Cover & Shelf */
    .book-cover-frame {
      box-shadow: 0 10px 22px -4px rgba(0, 0, 0, 0.7), -2px 0 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .group:hover .book-cover-frame {
      transform: translateY(-5px);
      box-shadow: 0 16px 28px -4px rgba(0, 0, 0, 0.85);
    }
    .shelf-plank-bar {
      height: 12px;
      background: linear-gradient(180deg, #2B3242 0%, #1B202C 65%, #10131B 100%);
      border-radius: 6px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 10;
    }
    body.theme-paper .shelf-plank-bar {
      background: linear-gradient(180deg, #D8CBB8 0%, #B8A68E 65%, #9B886E 100%);
      box-shadow: 0 6px 14px rgba(30, 25, 22, 0.2);
    }
    .fairy-lights-row { display: flex; justify-content: space-around; padding: 0 18px; margin-top: -1px; height: 16px; pointer-events: none; }
    .fairy-bulb {
      width: 6px; height: 6px; border-radius: 9999px; background: #FEF08A;
      box-shadow: 0 0 10px 3px rgba(251, 191, 36, 0.9); position: relative; animation: twinkleBulb 2.4s infinite ease-in-out;
    }
    .fairy-bulb::before { content: ''; position: absolute; top: -4px; left: 2px; width: 1.5px; height: 4px; background: rgba(255, 255, 255, 0.35); }
    @keyframes twinkleBulb { 0%, 100% { opacity: 0.65; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }

    /* Native Reader Themes */
    .reader-theme-paper { background-color: #F5EFE6; color: #1E1916; }
    .reader-theme-sepia { background-color: #EADBC8; color: #2B2118; }
    .reader-theme-night { background-color: #0E1015; color: #E5E7EB; }
    .reader-theme-night canvas { filter: invert(0.9) hue-rotate(180deg) contrast(0.95); }
  </style>
</head>
<body class="min-h-screen pb-32">

  <!-- ================= 1. SPLASH LOADER ================= -->
  <div id="smartSplashLoader" class="fixed inset-0 z-50 bg-[#0D0F14] text-white flex flex-col items-center justify-center p-6 transition-opacity duration-200">
    <div class="w-16 h-16 rounded-2xl bg-amber-500 text-[#0D0F14] flex items-center justify-center font-serif-display font-bold text-3xl shadow-xl mb-4 animate-bounce">စာ</div>
    <h1 class="font-serif-display font-bold text-xl mt-2">စာ — ဒစ်ဂျစ်တယ် စာကြည့်တိုက်</h1>
  </div>

  <!-- ================= 2. NAVBAR (NO ADMIN BTN) ================= -->
  <header class="sticky top-0 z-30 bg-[#0D0F14]/95 backdrop-blur-md border-b border-white/10 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchBottomTab('all')">
        <div class="w-9 h-9 rounded-full bg-amber-500 text-[#0D0F14] flex items-center justify-center font-serif-display font-bold text-base shadow">စာ</div>
        <span class="font-serif-display font-bold text-base">စာ</span>
        <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-[10px] font-bold text-emerald-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 1 online
        </span>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="toggleSiteTheme()" class="tactile-btn px-3 py-1.5 rounded-full bg-white/10 border border-white/15 text-xs font-bold flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-purple-400"></span><span id="siteThemeText">Midnight</span>
        </button>
        <button onclick="openRequestModal()" class="tactile-btn w-8 h-8 rounded-full bg-white/10 border border-white/15 flex items-center justify-center text-xs">🔔</button>
        <button onclick="openVipModal()" class="tactile-btn px-3 py-1.5 rounded-full bg-amber-900/40 border border-amber-500/40 text-amber-300 text-xs font-bold">👑 VIP</button>
      </div>
    </div>
  </header>

  <!-- ================= 3. MAIN CONTENT ================= -->
  <main class="max-w-5xl mx-auto px-3 sm:px-4 pt-5 space-y-5">
    
    <section id="sponsorBannerSection" class="hidden">
      <a id="sponsorBannerLink" href="#" target="_blank" class="block relative rounded-2xl overflow-hidden border border-white/15 shadow-xs group">
        <img id="sponsorBannerImg" src="" class="w-full max-h-40 object-cover" />
        <span class="absolute top-2 right-2 px-2 py-0.5 rounded bg-black/70 text-white text-[9px] font-bold">ကြော်ငြာ</span>
      </a>
    </section>

    <!-- SEARCH & CATEGORIES -->
    <section id="searchSectionBox" class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <input id="searchInput" type="search" oninput="onFilterOrSearchChange()" placeholder="🔍 စာအုပ်အမည် သို့မဟုတ် စာရေးဆရာ ရှာရန်..." class="flex-1 pl-4 pr-9 py-2.5 rounded-2xl bg-white/10 border border-white/15 text-xs sm:text-sm focus:outline-none focus:border-amber-400" />
        <select id="sortSelect" onchange="onFilterOrSearchChange()" class="px-3.5 py-2.5 rounded-2xl bg-[#181B24] border border-white/15 text-xs font-bold text-amber-400 focus:outline-none">
          <option value="newest">🕒 အသစ်ဆုံး စာအုပ်များ</option>
          <option value="popular">🔥 လူဖတ်အများဆုံး</option>
          <option value="pages_asc">📄 စာမျက်နှာ အနည်းမှအများ</option>
        </select>
      </div>
      <div id="categoryTabsBox" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>
    </section>

    <!-- BOOKSHELF -->
    <section class="bg-[#12151E]/90 border border-white/10 rounded-3xl p-4 sm:p-6 shadow-2xl space-y-6">
      <div class="flex items-center justify-between px-1">
        <h2 class="font-bold text-base sm:text-lg tracking-wide">စာအုပ်စင်</h2>
        <span id="totalBooksCountText" class="text-xs font-bold text-gray-400">စာအုပ်များ ရယူနေသည်...</span>
      </div>
      <div id="cleanShelfRows" class="space-y-8">
        <div class="py-12 text-center space-y-3">
          <div class="w-8 h-8 border-3 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-xs text-gray-400">စာအုပ်စင် ရယူနေပါသည်...</p>
        </div>
      </div>
      <div id="shelfPaginationBar" class="flex items-center justify-center gap-2 pt-2"></div>
    </section>
  </main>

  <!-- ================= 4. BOTTOM NAV ================= -->
  <nav class="fixed bottom-3 inset-x-0 z-30 px-4 pointer-events-none">
    <div class="max-w-md mx-auto bg-[#181B24]/95 backdrop-blur-md border border-white/15 rounded-3xl px-3 py-2 shadow-2xl grid grid-cols-4 gap-1 text-center text-[11px] font-bold pointer-events-auto">
      <button onclick="switchBottomTab('all')" id="navBtnAll" class="tactile-btn py-1.5 rounded-2xl text-amber-400 flex flex-col items-center gap-0.5">
        <span class="text-base">📚</span><span>စာအုပ်စင်</span>
      </button>
      <button onclick="focusSearchInput()" id="navBtnSearch" class="tactile-btn py-1.5 rounded-2xl text-gray-400 flex flex-col items-center gap-0.5">
        <span class="text-base">🔍</span><span>ရှာဖွေရန်</span>
      </button>
      <button onclick="switchBottomTab('bookmarks')" id="navBtnBookmarks" class="tactile-btn py-1.5 rounded-2xl text-gray-400 flex flex-col items-center gap-0.5">
        <span class="text-base">🔖</span><span>မှတ်ထားသော</span>
      </button>
      <button onclick="switchBottomTab('progress')" id="navBtnProgress" class="tactile-btn py-1.5 rounded-2xl text-gray-400 flex flex-col items-center gap-0.5">
        <span class="text-base">📖</span><span>ဖတ်လက်စ</span>
      </button>
    </div>
  </nav>

  <!-- ================= 5. BOOK DETAIL MODAL ================= -->
  <div id="bookDetailModal" style="display: none;" class="fixed inset-0 z-40 bg-black/75 backdrop-blur-xs items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#FAF8F5] text-[#1E1916] border-t sm:border border-[#E5DEC9] rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex items-start justify-between gap-3">
        <div class="flex gap-4">
          <div class="w-24 h-36 rounded-xl bg-[#E5DEC9] overflow-hidden shrink-0 book-cover-frame">
            <img id="detailCoverImg" src="" class="w-full h-full object-cover" />
          </div>
          <div class="space-y-1.5">
            <span id="detailCatBadge" class="inline-block px-2.5 py-0.5 rounded-full bg-[#6B141A]/10 text-[#6B141A] text-[10px] font-bold">အထွေထွေ</span>
            <h3 id="detailTitle" class="font-bold text-base sm:text-lg leading-snug"></h3>
            <p id="detailAuthor" class="text-xs font-bold text-[#6B141A]"></p>
            <p id="detailMeta" class="text-[11px] text-[#786E65]"></p>
          </div>
        </div>
        <button onclick="closeBookDetail()" class="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center font-bold text-sm shrink-0">✕</button>
      </div>
      <p id="detailDesc" class="text-xs bg-[#F3EFE6] p-3.5 rounded-2xl border border-[#E5DEC9] whitespace-pre-line"></p>
      
      <div class="grid grid-cols-2 gap-2.5 pt-1">
        <button id="detailReadNowBtn" class="tactile-btn col-span-2 py-3 rounded-2xl bg-[#6B141A] text-white font-bold text-sm shadow-md">
          📖 စာအုပ်ဖတ်မည်
        </button>
        <button id="detailOfflineBtn" onclick="saveCurrentBookOffline()" class="tactile-btn py-2.5 rounded-xl bg-emerald-100 text-emerald-900 font-bold text-xs">📥 Offline သိမ်းမည်</button>
        <div class="grid grid-cols-2 gap-2">
          <button id="detailBookmarkBtn" onclick="toggleCurrentBookFavorite()" class="tactile-btn py-2.5 rounded-xl bg-[#F3EFE6] border border-[#E5DEC9] font-bold text-xs">🔖 မှတ်မည်</button>
          <button onclick="shareCurrentBook()" class="tactile-btn py-2.5 rounded-xl bg-[#F3EFE6] border border-[#E5DEC9] font-bold text-xs">🔗 မျှဝေမည်</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 6. NATIVE-LIKE PDF READER ================= -->
  <div id="pdfReaderModal" style="display: none;" class="fixed inset-0 z-50 flex-col reader-theme-paper select-none">
    <div class="flex items-center justify-between px-3 py-2.5 border-b border-black/10 bg-black/5 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <button onclick="closePdfReader()" class="tactile-btn px-3 py-1.5 rounded-xl bg-[#6B141A] text-white text-xs font-bold shrink-0">← ပိတ်မည်</button>
        <h3 id="readerBookTitle" class="font-bold text-xs sm:text-sm truncate"></h3>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button onclick="changeReaderZoom(-0.25)" class="tactile-btn w-8 h-8 rounded-lg bg-black/10 text-xs font-bold">A-</button>
        <button onclick="resetReaderZoom()" id="readerZoomLabel" class="tactile-btn px-2 h-8 rounded-lg bg-black/10 text-[11px] font-mono font-bold">100%</button>
        <button onclick="changeReaderZoom(0.25)" class="tactile-btn w-8 h-8 rounded-lg bg-black/10 text-xs font-bold">A+</button>
        <button onclick="cycleReaderTheme()" class="tactile-btn px-2 h-8 rounded-lg bg-black/10 text-xs font-bold">🌗</button>
      </div>
    </div>

    <div id="readerCanvasContainer" class="flex-1 overflow-auto relative p-2 flex justify-center items-start touch-pan-x touch-pan-y">
      <div id="readerLoadingSpinner" style="display: none;" class="fixed inset-x-0 top-14 bottom-16 flex flex-col items-center justify-center bg-black/20 backdrop-blur-sm z-20">
        <div class="bg-white rounded-3xl p-5 shadow-2xl space-y-3 text-center w-48 border border-gray-200">
          <div class="w-8 h-8 border-4 border-[#6B141A] border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p id="readerLoadText" class="text-[11px] font-bold text-[#1E1916]">ဖွင့်နေပါသည်...</p>
        </div>
      </div>
      <div class="my-auto flex items-center justify-center">
        <canvas id="pdfRenderCanvas" class="shadow-2xl rounded bg-white"></canvas>
      </div>
    </div>

    <div class="px-3 py-2.5 border-t border-black/10 bg-[#12151E] text-white flex flex-col sm:flex-row items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-2 w-full sm:w-auto justify-between">
        <button onclick="changePdfPage(-1)" class="tactile-btn px-4 py-2 rounded-full bg-white/10 text-white text-xs font-bold">◀ ရှေ့သို့</button>
        <button onclick="promptJumpToPage()" id="readerPageIndicator" class="px-3.5 py-1.5 rounded-full bg-white/10 text-xs font-bold font-mono text-amber-400">1 / 1</button>
        <button onclick="changePdfPage(1)" class="tactile-btn px-4 py-2 rounded-full bg-amber-500 text-[#0D0F14] text-xs font-bold">နောက်သို့ ▶</button>
      </div>
      <input id="readerPageSlider" type="range" min="1" max="1" value="1" oninput="onPageSliderInput(this.value)" class="w-full sm:w-64 accent-amber-500" />
    </div>
  </div>

  <!-- MODALS -->
  <div id="requestModal" style="display: none;" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-xs items-center justify-center p-4">
    <!-- Same as before -->
    <div class="bg-[#FAF8F5] text-[#1E1916] rounded-3xl p-6 shadow-2xl space-y-4 w-full max-w-sm">
      <div class="flex justify-between border-b pb-2"><h3 class="font-bold">စာအုပ်တောင်းဆိုရန်</h3><button onclick="closeRequestModal()">✕</button></div>
      <p class="text-xs">ခေတ္တပိတ်ထားပါသည်။</p>
    </div>
  </div>
  <div id="vipModal" style="display: none;" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-xs items-center justify-center p-4">
    <!-- Same as before -->
    <div class="bg-[#FAF8F5] text-[#1E1916] rounded-3xl p-6 shadow-2xl space-y-4 w-full max-w-sm text-center">
      <h3 class="font-bold">VIP System</h3>
      <button onclick="closeVipModal()" class="tactile-btn w-full py-2 bg-gray-200 rounded-xl">ပိတ်မည်</button>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const SUPABASE_URL = 'https://ksgxlvrojzawvkkvsbyi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BcZTWsRcRYEJ_dtSAg1VnA_VWNE9FSg';
    const SAR_CACHE_BOOKS_KEY = 'SAR_BOOKS_V3';
    const SAR_CACHE_CATS_KEY = 'SAR_CATS_V3';
    const OFFLINE_BOOKS_KEY = 'SAR_OFFLINE_V1';
    
    let supabaseClient = null;
    let allPublishedBooks = [];
    let currentBooksList = [];
    let categoriesList = [];
    let selectedCategoryId = '';
    let activeBottomFilter = 'all';
    let currentShelfPage = 1;
    let currentDetailBook = null;

    // Reader State
    let activePdfDoc = null;
    let activeLoadingTask = null;
    let activePdfPage = 1;
    let activePdfTotalPages = 1;
    let activePdfZoom = 1.0;
    let activeBookIdForReader = null;
    let currentRenderTask = null;
    let renderQueuePage = null;

    const _activePdfDownloads = new Map();

    // URLs
    function toFastCdnUrl(url) {
      if(!url) return '';
      const m = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
      if(m) return `https://cdn.jsdelivr.net/gh/${m[1]}/${m[2]}@${m[3]}/${m[4]}`;
      return url.trim();
    }
    function toRawGitHubUrl(url) {
      if(!url) return '';
      const m = url.match(/^https:\/\/cdn\.jsdelivr\.net\/gh\/([^/]+)\/([^/@]+)@([^/]+)\/(.+)$/);
      if(m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}/${m[4]}`;
      return url.trim();
    }

    function toggleSiteTheme() {
      document.body.classList.toggle('theme-paper');
      document.getElementById('siteThemeText').textContent = document.body.classList.contains('theme-paper') ? 'Paper' : 'Midnight';
      renderCleanShelfRows(currentBooksList);
    }
    function focusSearchInput() {
      document.getElementById('searchInput')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { document.getElementById('smartSplashLoader').style.display = 'none'; }, 600);
      try {
        allPublishedBooks = JSON.parse(localStorage.getItem(SAR_CACHE_BOOKS_KEY) || '[]');
        categoriesList = JSON.parse(localStorage.getItem(SAR_CACHE_CATS_KEY) || '[]');
        if(allPublishedBooks.length > 0) {
          renderCategoryTabs(); renderBooksFromMemory(allPublishedBooks);
        }
      } catch(e) {}

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      loadBooks();
      supabaseClient.from('categories').select('*').order('name').then(({ data }) => {
        if(data) { categoriesList = data; localStorage.setItem(SAR_CACHE_CATS_KEY, JSON.stringify(data)); renderCategoryTabs(); }
      });
    });

    async function loadBooks() {
      try {
        const { data: books, error } = await supabaseClient.from('books').select('*, categories(name)').order('created_at', { ascending: false });
        if (error) throw error;
        allPublishedBooks = (books || []).filter(b => !b.status || b.status === 'published');
        localStorage.setItem(SAR_CACHE_BOOKS_KEY, JSON.stringify(allPublishedBooks));
        renderBooksFromMemory(allPublishedBooks);
      } catch (err) {
        if(allPublishedBooks.length === 0) document.getElementById('cleanShelfRows').innerHTML = `<p class="text-center text-amber-400">အင်တာနက် နှေးနေပါသည်...</p>`;
      }
    }

    function getFavoritesIds() { return JSON.parse(localStorage.getItem('SAR_FAV_BOOKS') || '[]'); }
    function getOfflineBookIds() { return JSON.parse(localStorage.getItem(OFFLINE_BOOKS_KEY) || '[]'); }

    function renderCategoryTabs() {
      const box = document.getElementById('categoryTabsBox');
      const allBtn = `<button onclick="selectCategory('')" class="tactile-btn px-3.5 py-1.5 rounded-full text-xs font-bold shrink-0 ${selectedCategoryId === '' ? 'bg-amber-500 text-[#0D0F14]' : 'bg-white/10'}">အားလုံး</button>`;
      const catBtns = categoriesList.map((c) => `<button onclick="selectCategory('${c.id}')" class="tactile-btn px-3.5 py-1.5 rounded-full text-xs font-bold shrink-0 ${String(selectedCategoryId) === String(c.id) ? 'bg-amber-500 text-[#0D0F14]' : 'bg-white/10'}">${c.name}</button>`).join('');
      box.innerHTML = allBtn + catBtns;
    }
    function selectCategory(catId) { selectedCategoryId = catId; currentShelfPage = 1; renderCategoryTabs(); renderBooksFromMemory(allPublishedBooks); }
    function onFilterOrSearchChange() { currentShelfPage = 1; renderBooksFromMemory(allPublishedBooks); }
    function switchBottomTab(tab) {
      activeBottomFilter = tab; currentShelfPage = 1;
      ['all', 'bookmarks', 'progress'].forEach((t) => {
        const btn = document.getElementById('navBtn' + t.charAt(0).toUpperCase() + t.slice(1));
        if(btn) btn.className = t === tab ? 'tactile-btn py-1.5 rounded-2xl text-amber-400 flex flex-col items-center gap-0.5' : 'tactile-btn py-1.5 rounded-2xl text-gray-400 flex flex-col items-center gap-0.5';
      });
      renderBooksFromMemory(allPublishedBooks);
    }

    function renderBooksFromMemory(sourceBooks) {
      const search = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      let filtered = sourceBooks.filter(b => (!selectedCategoryId || String(b.category_id) === String(selectedCategoryId)) && (!search || (b.title||'').toLowerCase().includes(search) || (b.author||'').toLowerCase().includes(search)));
      
      const sort = document.getElementById('sortSelect')?.value || 'newest';
      if(sort === 'newest') filtered.sort((a, b) => new Date(b.created_at||0) - new Date(a.created_at||0));
      if(sort === 'popular') filtered.sort((a, b) => (b.read_count||0) - (a.read_count||0));
      
      if(activeBottomFilter === 'bookmarks') { const favs = getFavoritesIds(); filtered = filtered.filter(b => favs.includes(String(b.id))); }
      else if(activeBottomFilter === 'progress') { filtered = filtered.filter(b => localStorage.getItem('BOOK_PAGE_' + b.id)); }

      currentBooksList = filtered;
      document.getElementById('totalBooksCountText').textContent = `စာအုပ် (${filtered.length})`;
      renderCleanShelfRows(filtered);
    }

    function changeShelfPage(p) { currentShelfPage = p; renderCleanShelfRows(currentBooksList); window.scrollTo({ top: 0 }); }

    function renderCleanShelfRows(books) {
      const container = document.getElementById('cleanShelfRows');
      const pagBar = document.getElementById('shelfPaginationBar');
      if (books.length === 0) { container.innerHTML = `<p class="py-16 text-center text-gray-400">စာအုပ် မတွေ့ရှိပါ။</p>`; pagBar.innerHTML = ''; return; }

      const offIds = getOfflineBookIds();
      const isPaper = document.body.classList.contains('theme-paper');
      const startIdx = (currentShelfPage - 1) * 12;
      const pageBooks = books.slice(startIdx, startIdx + 12);

      const rows = [];
      for (let i = 0; i < pageBooks.length; i += 4) rows.push(pageBooks.slice(i, i + 4));

      container.innerHTML = rows.map((rowBooks, rowIdx) => `
        <div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 px-2 sm:px-4 items-end">
            ${rowBooks.map((b, idx) => {
              const savedPage = localStorage.getItem('BOOK_PAGE_' + b.id);
              const isOffline = offIds.includes(String(b.id));
              const cover = toFastCdnUrl(b.cover_url);
              return `
                <div onclick="openBookDetail('${b.id}')" class="flex flex-col items-center cursor-pointer group">
                  <div class="w-full max-w-[165px] aspect-[2/3] rounded-t-xl rounded-b-md bg-[#222736] overflow-hidden book-cover-frame relative">
                    <img src="${cover}" class="w-full h-full object-cover" loading="lazy" />
                    <span class="absolute top-1.5 right-1.5 px-2 py-0.5 rounded-md bg-black/75 text-amber-300 text-[10px] font-bold">👁 ${b.read_count || 0}</span>
                    ${isOffline ? `<span class="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md bg-emerald-600 text-white text-[9px] font-bold shadow">✅ Offline</span>` : ''}
                    ${savedPage ? `<span class="absolute bottom-1.5 left-1.5 px-2 py-0.5 rounded-md bg-amber-500 text-black text-[9px] font-bold shadow">စာ-${savedPage}</span>` : ''}
                  </div>
                  <div class="w-full max-w-[165px] mt-1.5 px-2 py-1.5 rounded-t-lg ${isPaper ? 'bg-white border border-[#E5DEC9] text-[#1E1916]' : 'bg-[#1A1F2C] border border-amber-500/30 text-white'} text-center shadow-md">
                    <h4 class="font-bold text-[11px] sm:text-xs leading-snug line-clamp-1">${b.title||'အမည်မသိ'}</h4>
                    <p class="text-[10px] font-bold text-amber-500 truncate mt-0.5">✍️ ${b.author||'အမည်မသိ'}</p>
                  </div>
                </div>`;
            }).join('')}
          </div>
          <div class="shelf-plank-bar"></div>
          <div class="fairy-lights-row"><span class="fairy-bulb"></span><span class="fairy-bulb" style="animation-delay: 0.4s"></span><span class="fairy-bulb" style="animation-delay: 0.8s"></span><span class="fairy-bulb" style="animation-delay: 1.2s"></span></div>
        </div>
      `).join('');

      const totalPages = Math.ceil(books.length / 12);
      pagBar.innerHTML = totalPages <= 1 ? '' : Array.from({length: totalPages}, (_, i) => `<button onclick="changeShelfPage(${i+1})" class="w-8 h-8 rounded-xl font-bold text-xs ${i+1===currentShelfPage ? 'bg-amber-500 text-black' : 'bg-white/10'}">${i+1}</button>`).join(' ');
    }

    // DETAIL MODAL & BACKGROUND PRELOAD
    function startBackgroundPdfPreload(book) {
      if(!book || !book.pdf_url) return null;
      const key = String(book.id);
      if(_activePdfDownloads.has(key)) return _activePdfDownloads.get(key);

      const entry = { promise: null };
      entry.promise = (async () => {
        const url = toFastCdnUrl(book.pdf_url);
        if('caches' in window) {
          const c = await caches.match(url);
          if(c) { const buf = await c.arrayBuffer(); return window.pdfjsLib.getDocument({data: buf}).promise; }
        }
        if(url.includes('#parts=')) {
          const prefix = url.split('#parts=')[0].replace(/\.part0$/, '');
          const parts = parseInt(url.split('#parts=')[1]||'1');
          const bufs = await Promise.all(Array.from({length: parts}, (_,i)=> fetch(`${prefix}.part${i}`).then(r=>r.arrayBuffer())));
          return window.pdfjsLib.getDocument(URL.createObjectURL(new Blob(bufs))).promise;
        }
        // INSTANT STREAMING MAGIC
        return window.pdfjsLib.getDocument({ url, disableAutoFetch: true, rangeChunkSize: 524288 }).promise;
      })();
      _activePdfDownloads.set(key, entry);
      return entry;
    }

    async function openBookDetail(bookId) {
      const b = allPublishedBooks.find(x => String(x.id) === String(bookId));
      if (!b) return;
      currentDetailBook = b;
      document.getElementById('detailCoverImg').src = toFastCdnUrl(b.cover_url);
      document.getElementById('detailTitle').textContent = b.title;
      document.getElementById('detailAuthor').textContent = `✍️ ${b.author}`;
      document.getElementById('detailMeta').textContent = `📄 ${b.page_count||1} မျက်နှာ • 👁 ${b.read_count||0} ကြိမ်`;
      
      const savedPage = localStorage.getItem('BOOK_PAGE_' + b.id);
      document.getElementById('detailReadNowBtn').textContent = savedPage ? `📖 စာမျက်နှာ (${savedPage}) မှ ဆက်ဖတ်မည်` : '📖 စာအုပ်ဖတ်မည်';
      updateDetailButtonsUI();
      document.getElementById('bookDetailModal').style.display = 'flex';
      
      startBackgroundPdfPreload(b); // Preload immediately!
    }

    function closeBookDetail() { document.getElementById('bookDetailModal').style.display = 'none'; }
    
    function updateDetailButtonsUI() {
      if(!currentDetailBook) return;
      document.getElementById('detailBookmarkBtn').textContent = getFavoritesIds().includes(String(currentDetailBook.id)) ? '✅ မှတ်ထားပြီး' : '🔖 မှတ်မည်';
      document.getElementById('detailOfflineBtn').textContent = getOfflineBookIds().includes(String(currentDetailBook.id)) ? '✅ Offline သိမ်းပြီး' : '📥 Offline သိမ်းမည်';
    }
    function toggleCurrentBookFavorite() {
      if(!currentDetailBook) return;
      const id = String(currentDetailBook.id);
      let f = getFavoritesIds();
      if(f.includes(id)) f = f.filter(x=>x!==id); else f.push(id);
      localStorage.setItem('SAR_FAV_BOOKS', JSON.stringify(f));
      updateDetailButtonsUI(); renderBooksFromMemory(allPublishedBooks);
    }
    async function saveCurrentBookOffline() {
      if(!currentDetailBook) return;
      const btn = document.getElementById('detailOfflineBtn');
      btn.disabled = true; btn.textContent = '⏳ သိမ်းဆည်းနေသည်...';
      try {
        const cache = await caches.open('sar-offline-pdfs-v6');
        await cache.add(toFastCdnUrl(currentDetailBook.pdf_url));
        const off = getOfflineBookIds(); off.push(String(currentDetailBook.id));
        localStorage.setItem(OFFLINE_BOOKS_KEY, JSON.stringify(off));
        updateDetailButtonsUI(); renderBooksFromMemory(allPublishedBooks);
      } catch(e) { btn.textContent = '📥 Offline သိမ်းမည်'; }
      finally { btn.disabled = false; }
    }
    function shareCurrentBook() {
      if(navigator.share) navigator.share({ title: currentDetailBook.title, url: `?book=${currentDetailBook.id}` }).catch(()=>{});
    }

    // READER
    document.getElementById('detailReadNowBtn').onclick = async () => {
      closeBookDetail();
      const b = currentDetailBook;
      activeBookIdForReader = b.id;
      document.getElementById('readerBookTitle').textContent = b.title;
      document.getElementById('pdfReaderModal').style.display = 'flex';
      const spin = document.getElementById('readerLoadingSpinner');
      spin.style.display = 'flex';
      
      try {
        if (activePdfDoc) await activePdfDoc.destroy().catch(()=>{});
        const preload = startBackgroundPdfPreload(b);
        activePdfDoc = await preload.promise;
        activePdfTotalPages = activePdfDoc.numPages;
        activePdfPage = Math.min(parseInt(localStorage.getItem('BOOK_PAGE_'+b.id)||'1'), activePdfTotalPages);
        document.getElementById('readerPageSlider').max = activePdfTotalPages;
        await renderPdfPage(activePdfPage, true);
      } catch(e) { alert('Error: '+e); closePdfReader(); }
    };

    async function renderPdfPage(pageNum, isFirst = false) {
      if(!activePdfDoc) return;
      if(currentRenderTask) { renderQueuePage = pageNum; try { currentRenderTask.cancel(); }catch(e){} return; }
      
      const spin = document.getElementById('readerLoadingSpinner');
      if(isFirst) spin.style.display = 'flex';

      try {
        const page = await activePdfDoc.getPage(pageNum);
        const canvas = document.getElementById('pdfRenderCanvas');
        const ctx = canvas.getContext('2d');
        const vp = page.getViewport({ scale: 1 });
        const availW = window.innerWidth - 16;
        const scale = (availW / vp.width) * activePdfZoom;
        const renderVp = page.getViewport({ scale: scale * Math.min(window.devicePixelRatio||1, 1.5) });

        canvas.width = renderVp.width; canvas.height = renderVp.height;
        canvas.style.width = `${vp.width * scale}px`;
        
        currentRenderTask = page.render({ canvasContext: ctx, viewport: renderVp });
        await currentRenderTask.promise;
        currentRenderTask = null;

        document.getElementById('readerCanvasContainer').scrollTo(0,0);
        document.getElementById('readerPageIndicator').textContent = `${pageNum} / ${activePdfTotalPages}`;
        document.getElementById('readerPageSlider').value = pageNum;
        localStorage.setItem('BOOK_PAGE_'+activeBookIdForReader, pageNum);
        
        if(pageNum < activePdfTotalPages) activePdfDoc.getPage(pageNum+1).catch(()=>{});
      } catch(e) { currentRenderTask = null; }
      finally {
        spin.style.display = 'none';
        if(renderQueuePage !== null) { const n = renderQueuePage; renderQueuePage = null; renderPdfPage(n); }
      }
    }

    function changePdfPage(d) {
      if(!activePdfDoc) return;
      const n = activePdfPage + d;
      if(n >= 1 && n <= activePdfTotalPages) { activePdfPage = n; renderPdfPage(n); }
    }
    function onPageSliderInput(v) { activePdfPage = parseInt(v); renderPdfPage(activePdfPage); }
    function promptJumpToPage() {
      const num = parseInt(prompt(`(1 - ${activePdfTotalPages}):`, activePdfPage));
      if(num >= 1 && num <= activePdfTotalPages) { activePdfPage = num; renderPdfPage(num); }
    }
    function changeReaderZoom(d) { activePdfZoom = Math.min(Math.max(activePdfZoom+d, 0.75), 2.5); document.getElementById('readerZoomLabel').textContent = `${Math.round(activePdfZoom*100)}%`; renderPdfPage(activePdfPage); }
    function resetReaderZoom() { activePdfZoom = 1.0; document.getElementById('readerZoomLabel').textContent = '100%'; renderPdfPage(activePdfPage); }
    function cycleReaderTheme() { const m = document.getElementById('pdfReaderModal'); const t = ['reader-theme-paper','reader-theme-sepia','reader-theme-night']; m.className = m.className.replace(/reader-theme-\w+/,''); m.classList.add(t[(t.indexOf(m.classList.value.match(/reader-theme-\w+/)?.[0]||'')+1)%3]); }
    function closePdfReader() { document.getElementById('pdfReaderModal').style.display = 'none'; if(currentRenderTask) try{currentRenderTask.cancel();}catch(e){} if(activePdfDoc) activePdfDoc.destroy().catch(()=>{}); activePdfDoc = null; renderCleanShelfRows(currentBooksList); }

    // TOUCH SWIPE
    let tsX=0, tsY=0;
    document.getElementById('readerCanvasContainer')?.addEventListener('touchstart', e => { if(e.touches.length===1) { tsX = e.touches[0].screenX; tsY = e.touches[0].screenY; } }, {passive:true});
    document.getElementById('readerCanvasContainer')?.addEventListener('touchend', e => {
      if(activePdfZoom > 1.05 || e.changedTouches.length>1) return;
      const dx = e.changedTouches[0].screenX - tsX; const dy = e.changedTouches[0].screenY - tsY;
      if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5) changePdfPage(dx < 0 ? 1 : -1);
    }, {passive:true});
    window.addEventListener('keydown', e => { if(document.getElementById('pdfReaderModal').style.display !== 'none') { if(e.key==='ArrowRight') changePdfPage(1); if(e.key==='ArrowLeft') changePdfPage(-1); if(e.key==='Escape') closePdfReader(); } });

    function openRequestModal() {} function closeRequestModal() {} function openVipModal() {} function closeVipModal() {}
  </script>
</body>
</html>
